name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install 'torch>=2.14' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -e '.[test,nlu]'
      - name: Run tests without private model resources
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m pytest -q
      - name: Run the fixture demo
        run: python -m examples.standalone_contract
